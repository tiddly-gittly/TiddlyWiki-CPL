name: CPL Data Sync Guard

# Safety net for runtime-data sync PRs (data-sync/*). Complements the
# server-side guards in scripts/sync-data.ts: even if a corrupted mirror
# state slips through, this check blocks the PR before it can be merged,
# including via auto-merge. See tiddly-gittly/TiddlyWiki-CPL#283.

on:
  pull_request:
    paths:
      - 'wiki/tiddlers/comments/**'
      - 'wiki/tiddlers/ratings/**'
      - 'wiki/tiddlers/compatibility/**'
      - 'wiki/tiddlers/download-stats/**'

permissions:
  contents: read

jobs:
  reject-destructive-runtime-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject emptied files and shrinking stats
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node - <<'EOF'
          const { execFileSync } = require('child_process');

          const base = process.env.BASE_SHA;
          const head = process.env.HEAD_SHA;
          const syncPaths = [
            'wiki/tiddlers/comments',
            'wiki/tiddlers/ratings',
            'wiki/tiddlers/compatibility',
            'wiki/tiddlers/download-stats',
          ];

          const git = (args) =>
            execFileSync('git', args, { encoding: 'utf8' });
          const cat = (rev, p) => {
            try {
              return execFileSync('git', ['show', `${rev}:${p}`], {
                encoding: 'utf8',
                stdio: ['pipe', 'pipe', 'pipe'],
              });
            } catch {
              return null;
            }
          };
          const statsOf = (raw) => {
            if (raw === null) return null;
            const blank = raw.indexOf('\n\n');
            const body = (blank === -1 ? raw : raw.slice(blank + 2)).trim();
            if (!body) return null;
            try {
              const parsed = JSON.parse(body);
              if (typeof parsed.downloadCount !== 'number') return null;
              return {
                downloadCount: parsed.downloadCount,
                ips: new Set(Object.keys(parsed.downloadsByIp ?? {})),
              };
            } catch {
              return null;
            }
          };

          const changed = git([
            'diff', '--name-only', base, head, '--',
            ...syncPaths,
          ]).split('\n').filter(Boolean);

          const failures = [];
          for (const p of changed) {
            const baseRaw = cat(base, p);
            const headRaw = cat(head, p);

            if (headRaw === null) {
              if (baseRaw !== null && baseRaw.length > 0) {
                failures.push(`${p}: runtime data file was deleted`);
              }
              continue;
            }
            if (headRaw.length === 0) {
              failures.push(
                baseRaw === null
                  ? `${p}: empty runtime data file added`
                  : `${p}: runtime data file was emptied`,
              );
              continue;
            }
            if (baseRaw === null) continue; // new non-empty file: fine

            if (p.includes('/download-stats/')) {
              const before = statsOf(baseRaw);
              const after = statsOf(headRaw);
              if (!after) {
                failures.push(`${p}: unparseable download stats in PR`);
                continue;
              }
              if (!before) continue; // base unparsable: nothing to compare
              const lostIps = [...before.ips].filter((ip) => !after.ips.has(ip));
              if (
                after.downloadCount < before.downloadCount ||
                lostIps.length > 0
              ) {
                failures.push(
                  `${p}: stats would shrink ` +
                  `(downloadCount ${before.downloadCount} -> ${after.downloadCount}, ` +
                  `lost IPs: ${lostIps.join(', ') || 'none'})`,
                );
              }
            }
          }

          if (failures.length > 0) {
            console.error('Destructive runtime-data changes detected:');
            for (const f of failures) console.error(`  - ${f}`);
            console.error(
              'If this PR was auto-generated, fix the source mirror instead ' +
              'of merging; sync-data.ts quarantines corrupt local files.'
            );
            process.exit(1);
          }
          console.log(`Runtime data diff OK (${changed.length} file(s) checked)`);
          EOF
