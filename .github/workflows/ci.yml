name: CI

on:
  pull_request:
    paths-ignore:
      - 'wiki/tiddlers/download-stats/**'
      - 'wiki/tiddlers/comments/**'
      - 'wiki/tiddlers/ratings/**'
      - 'wiki/tiddlers/compatibility/**'
  push:
    branches:
      - master
    paths-ignore:
      - 'wiki/tiddlers/download-stats/**'
      - 'wiki/tiddlers/comments/**'
      - 'wiki/tiddlers/ratings/**'
      - 'wiki/tiddlers/compatibility/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-tests:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'data-sync/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      - name: Build static library (required for library artifact tests)
        run: pnpm run build:static-library

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run API tests
        run: pnpm run test:api

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm run test:e2e --project=chromium
        env:
          CI: true
          CPL_TEST_MODE: 'true'
